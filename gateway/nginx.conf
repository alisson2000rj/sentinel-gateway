# ============================================================
# Sentinel Security Gateway — nginx / OpenResty
# Proxy reverso com WAF Lua entre kali-attacker e owasp-lab-vulnbox-lab
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

# Permite que o Lua leia a variavel de ambiente WAF_MODE
env WAF_MODE;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # ── Log format com informações WAF ──────────────────────
    log_format gateway '$remote_addr [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       '"$http_user_agent" waf_mode=$waf_mode_header';

    access_log /var/log/nginx/access.log gateway;

    # ── Shared memory — estado e configuração do WAF ──────────
    # waf_mode     : active | passive
    # waf_config   : parâmetros dinâmicos das regras
    # waf_rate     : contadores de rate limiting por IP
    # waf_ip_block : IPs temporariamente bloqueados
    lua_shared_dict waf_mode      1m;
    lua_shared_dict waf_config    1m;
    lua_shared_dict waf_rate     10m;
    lua_shared_dict waf_ip_block 10m;

    # ── Inicializa o WAF e parâmetros padrão na partida ───────
    init_by_lua_block {
        local env_mode = os.getenv("WAF_MODE")
        local initial_mode = (env_mode == "passive") and "passive" or "active"
        ngx.shared.waf_mode:safe_set("mode", initial_mode)
        local cfg = ngx.shared.waf_config
        cfg:safe_set("bf_limit", 3)
        cfg:safe_set("bf_window", 3)
        cfg:safe_set("bf_block_time", 3600)
        cfg:safe_set("admin_limit", 3)
        cfg:safe_set("admin_block_time", 3600)
        cfg:safe_set("idor_distinct_limit", 3)
        cfg:safe_set("idor_limit", 15)
        cfg:safe_set("idor_block_time", 3600)
        cfg:safe_set("admin_ip_whitelist", "127.0.0.1")
    }

    charset utf-8;

    server {
        listen 80;
        server_name _;

        # Injeta header informativo de modo (para o log e resposta)
        set $waf_mode_header "active";

        # ── Endpoint de gestão do gateway + toggle UI ────────
        # Redireciona /_gateway → /_gateway/
        location = /_gateway {
            return 301 /_gateway/;
        }

        # Todas as rotas /_gateway/*
        location /_gateway/ {
            content_by_lua_file /etc/gateway/waf/gateway_api.lua;
        }

        # ── Proxy para aplicação web com inspeção WAF ────────
        location / {
            access_by_lua_file /etc/gateway/waf/rules.lua;

            header_filter_by_lua_block {
                local mode = ngx.shared.waf_mode:get("mode") or "active"
                ngx.header["X-WAF-Mode"] = mode
                local ct = ngx.header["Content-Type"] or ""
                if ct:lower():find("text/html", 1, true) then
                    ngx.header["Content-Length"] = nil
                    ngx.header["Content-Type"] = "text/html; charset=UTF-8"
                end

                -- Registra papel da sessão enviado pelo PHP (X-WAF-User-Role)
                local role_hdr = ngx.header["X-WAF-User-Role"]
                local sess_id = ngx.var.cookie_PHPSESSID
                if not sess_id then
                    local set_cookie = ngx.header["Set-Cookie"]
                    if set_cookie then
                        local cookie_str = type(set_cookie) == "table" and table.concat(set_cookie, ";") or tostring(set_cookie)
                        sess_id = cookie_str:match("PHPSESSID=([^;%s]+)")
                    end
                end

                if sess_id and role_hdr then
                    local role = (tostring(role_hdr):lower() == "admin") and "admin" or "user"
                    ngx.shared.waf_rate:set("role:" .. sess_id, role, 3600)
                end

                -- ── REGRA 7: Proteção contra Session Fixation (A07 — Atributos de Segurança) ──
                local sf_status = ngx.shared.waf_mode:get("rule:SESSION_FIXATION_PROTECTION") or "active"
                if mode == "active" and sf_status == "active" then
                    local set_cookie = ngx.header["Set-Cookie"]
                    if set_cookie then
                        local function secure_cookie(c_str)
                            if c_str:find("PHPSESSID=") then
                                if not c_str:find("HttpOnly", 1, true) then
                                    c_str = c_str .. "; HttpOnly"
                                end
                                if not c_str:find("SameSite", 1, true) then
                                    c_str = c_str .. "; SameSite=Strict"
                                end
                            end
                            return c_str
                        end

                        if type(set_cookie) == "table" then
                            for i, c in ipairs(set_cookie) do
                                set_cookie[i] = secure_cookie(c)
                            end
                            ngx.header["Set-Cookie"] = set_cookie
                        elseif type(set_cookie) == "string" then
                            ngx.header["Set-Cookie"] = secure_cookie(set_cookie)
                        end
                    end
                end
            }

            # Injeta banner WAF no topo de todas as páginas HTML
            body_filter_by_lua_file /etc/gateway/waf/banner.lua;

            proxy_pass         http://web:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }
    }
}

